# 复制本文件为同目录下的 AppSetting.yaml 并填写实际路径与密码。
# AppSetting.yaml 已加入 .gitignore，不会被提交。
# 相对路径以应用程序目录（AppContext.BaseDirectory）为基准。

CertificateProvider:
  # Device Provider 证书（DER 或 PEM）
  providerCertificatePath: "device-provider/ict_device_provider.cert.der"

  # Device Provider 私钥（PKCS#8 PEM，可加密）
  providerPrivateKeyPath: "device-provider/ict_device_provider.key.pem"

  # 私钥密码；无密码时留空
  providerPrivateKeyPassword: "change-me"

  # 可选：MOSIP 域加密证书
  # domainEncryptionCertificatePath: "device-provider/domain_encryption.cert.der"

Dkl1Issuer:
  # 叶证书 Subject 字段
  serialNo: "123456789012"
  make: "CCM"
  model: "CCM4201S"
  deviceProvider: "FTM-Test"

  # 可选：签发后的证书保存路径
  issuedCertificatePath: "device-provider/dkl1_device.cer"

Device:
  # FAP20 的 USB VID/PID，须与设备一致；支持 0x 十六进制、0 八进制与十进制
  vendorId: "0x0483"
  productId: "0x5725"
