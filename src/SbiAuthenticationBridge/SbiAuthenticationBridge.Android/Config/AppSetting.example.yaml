# 复制本文件为同目录下的 AppSetting.yaml 并填写实际路径与密码。
# AppSetting.yaml 已加入 .gitignore，不会被提交。
# Android 使用应用私有目录：/data/data/<ApplicationId>/files
# 证书文件放到其下的 device-provider/ 目录。

CertificateProvider:
  # Device Provider 证书（DER 或 PEM）
  providerCertificatePath: "/data/data/com.CompanyName.SbiAuthenticationBridge/files/device-provider/ict_device_provider.cert.der"

  # Device Provider 私钥（PKCS#8 PEM，可加密）
  providerPrivateKeyPath: "/data/data/com.CompanyName.SbiAuthenticationBridge/files/device-provider/ict_device_provider.key.pem"

  # 私钥密码；无密码时留空
  providerPrivateKeyPassword: "change-me"

  # MOSIP 域加密证书（认证采集必需）
  domainEncryptionCertificatePath: "/data/data/com.CompanyName.SbiAuthenticationBridge/files/device-provider/key.cer"

Dkl1Issuer:
  # 签发后的证书保存路径
  issuedCertificatePath: "/data/data/com.CompanyName.SbiAuthenticationBridge/files/device-provider/dkl1_device.cer"

Device:
  # FAP20 的 USB VID/PID，须与设备一致；支持 0x 十六进制、0 八进制与十进制
  vendorId: "0x0483"
  productId: "0x5725"
